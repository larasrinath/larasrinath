{{ define "main" }}
<main id="main-content" class="inner-page content-page" role="main">
  {{ partial "shared/page-hero.html" (dict
    "class" "page-hero compact-hero"
    "eyebrow" (.Section | default hugo.Data.ui.generic.page_fallback)
    "title" .Title
    "copy" .Description
  ) }}
  <article class="project-content-wrap"><div class="article-content project-content">{{ .Content }}</div></article>
</main>
{{ end }}
