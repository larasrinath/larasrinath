{{ define "main" }}
<main id="main-content" class="inner-page contact-page" role="main">
  {{ partial "shared/page-head.html" (dict
    "eyebrow" .Params.name
    "title" (.Params.hero_title | default .Title)
    "emphasis" .Params.hero_emphasis
    "copy" .Description
  ) }}
  <section class="contact-links-layout">
    {{ if .Params.show_social_links }}{{ partial "shared/social-links.html" . }}{{ end }}
  </section>
</main>
{{ end }}
