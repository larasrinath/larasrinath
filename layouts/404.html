{{ define "main" }}
{{ $notFound := site.Data.ui.not_found }}
<main id="main-content" class="inner-page not-found-page" role="main">
  <section class="app-shell not-found-content">
    <p class="section-label">{{ $notFound.code }} — {{ $notFound.label }}</p>
    <h1>{{ $notFound.heading }}</h1>
    <p>{{ $notFound.intro }}</p>
    <nav aria-label="{{ $notFound.links_label }}">
      {{ range $notFound.links }}<a href="{{ .href | relURL }}" class="app-button app-button-line">{{ .label }}</a>{{ end }}
    </nav>
  </section>
</main>
{{ end }}
