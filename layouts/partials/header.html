{{ $home := site.Data.home }}
{{ $ui := site.Data.ui }}
<header class="topbar{{ if .IsHome }} app-topbar{{ end }}" role="banner">
  <div class="topbar-inner">
    <a class="wordmark" href="{{ "/" | relURL }}" aria-label="{{ $ui.brand.home_label }}">
      {{ $ui.brand.name }}<span aria-hidden="true">.</span>
    </a>
    <nav aria-label="{{ $ui.accessibility.primary_navigation }}">
      <ul class="primary-nav">
        {{ range $home.navigation }}<li><a href="{{ .href }}">{{ .label }}</a></li>{{ end }}
      </ul>
    </nav>
    <a class="say-hello" href="{{ $home.navigation_cta.href }}">{{ $home.navigation_cta.label }} <span aria-hidden="true">{{ $home.navigation_cta.icon }}</span></a>
  </div>
</header>
