{{ $home := hugo.Data.home }}
{{ $ui := hugo.Data.ui }}
<header class="topbar{{ if .IsHome }} app-topbar{{ end }}" role="banner">
  <div class="topbar-inner">
    <a class="wordmark" href="{{ "/" | relURL }}" aria-label="{{ $ui.brand.home_label }}">
      {{ $ui.brand.name }}<span aria-hidden="true">.</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" aria-label="{{ $ui.accessibility.open_menu }}" data-menu-toggle data-open-label="{{ $ui.accessibility.open_menu }}" data-close-label="{{ $ui.accessibility.close_menu }}">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
    <nav id="primary-navigation" class="primary-navigation" aria-label="{{ $ui.accessibility.primary_navigation }}" data-menu>
      <ul class="primary-nav">
        {{ range $home.navigation }}<li><a href="{{ .href }}">{{ .label }}</a></li>{{ end }}
      </ul>
    </nav>
  </div>
</header>
