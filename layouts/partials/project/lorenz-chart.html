{{- $block := .block -}}
{{- $id := printf "lorenz-chart-%d" .index -}}
<figure class="article-editorial-chart">
  <div class="article-editorial-chart-frame">
    <canvas
      id="{{ $id }}"
      data-view="{{ $block.view | default "3d" }}"
      data-sigma="{{ $block.sigma | default 20 }}"
      data-rho="{{ $block.rho | default 28 }}"
      data-beta="{{ $block.beta | default 2.6666667 }}"
      data-dt="{{ $block.dt | default 0.01 }}"
      data-points="{{ $block.points | default 10000 }}"
      role="img"
      aria-label="{{ $block.aria_label | default "Lorenz attractor visualization" }}"></canvas>
  </div>
  {{- with $block.caption }}<figcaption>{{ . }}</figcaption>{{ end -}}
</figure>
<script>
(() => {
  const canvas = document.getElementById({{ $id | jsonify | safeJS }});
  if (!canvas || canvas.dataset.ready === "true") return;
  canvas.dataset.ready = "true";
  const context = canvas.getContext("2d");
  const sigma = Number(canvas.dataset.sigma);
  const rho = Number(canvas.dataset.rho);
  const beta = Number(canvas.dataset.beta);
  const dt = Number(canvas.dataset.dt);
  const pointCount = Number(canvas.dataset.points);
  const view = canvas.dataset.view;
  const points = [];
  let x = -1;
  let y = 1;
  let z = -1;
  for (let index = 0; index < pointCount; index += 1) {
    const nextX = x + sigma * (y - x) * dt;
    const nextY = y + (x * (rho - z) - y) * dt;
    const nextZ = z + (x * y - beta * z) * dt;
    x = nextX;
    y = nextY;
    z = nextZ;
    if (index > 80) points.push([x, y, z]);
  }

  let rotationX = -0.42;
  let rotationY = 0.68;
  let zoom = 0.92;
  let pointer = null;
  const colorAt = (value) => {
    const hue = 18 + value * 32;
    const lightness = 48 + value * 24;
    return `hsl(${hue} 72% ${lightness}%)`;
  };

  const draw = () => {
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const bounds = canvas.getBoundingClientRect();
    const width = Math.max(1, Math.round(bounds.width));
    const height = Math.max(1, Math.round(bounds.height));
    if (canvas.width !== width * ratio || canvas.height !== height * ratio) {
      canvas.width = width * ratio;
      canvas.height = height * ratio;
    }
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.clearRect(0, 0, width, height);
    context.fillStyle = "#171411";
    context.fillRect(0, 0, width, height);

    const projected = points.map(([pointX, pointY, pointZ]) => {
      if (view === "2d") return [pointX, pointZ, pointZ];
      const cosineY = Math.cos(rotationY);
      const sineY = Math.sin(rotationY);
      const cosineX = Math.cos(rotationX);
      const sineX = Math.sin(rotationX);
      const rotatedX = pointX * cosineY - pointZ * sineY;
      const rotatedZ = pointX * sineY + pointZ * cosineY;
      const rotatedY = pointY * cosineX - rotatedZ * sineX;
      return [rotatedX, rotatedY, pointZ];
    });
    const xs = projected.map((point) => point[0]);
    const ys = projected.map((point) => point[1]);
    const zs = projected.map((point) => point[2]);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const minY = Math.min(...ys);
    const maxY = Math.max(...ys);
    const minZ = Math.min(...zs);
    const maxZ = Math.max(...zs);
    const scale = Math.min(width / Math.max(1, maxX - minX), height / Math.max(1, maxY - minY)) * 0.78 * zoom;
    const centerX = (minX + maxX) / 2;
    const centerY = (minY + maxY) / 2;
    context.lineWidth = view === "2d" ? 1.2 : 0.72;
    context.lineJoin = "round";
    context.lineCap = "round";
    for (let index = 1; index < projected.length; index += 1) {
      const previous = projected[index - 1];
      const current = projected[index];
      const colorPosition = (current[2] - minZ) / Math.max(1, maxZ - minZ);
      context.strokeStyle = colorAt(colorPosition);
      context.beginPath();
      context.moveTo(width / 2 + (previous[0] - centerX) * scale, height / 2 - (previous[1] - centerY) * scale);
      context.lineTo(width / 2 + (current[0] - centerX) * scale, height / 2 - (current[1] - centerY) * scale);
      context.stroke();
    }
  };

  if (view === "3d") {
    canvas.addEventListener("pointerdown", (event) => {
      pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener("pointermove", (event) => {
      if (!pointer || pointer.id !== event.pointerId) return;
      rotationY += (event.clientX - pointer.x) * 0.008;
      rotationX += (event.clientY - pointer.y) * 0.008;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      draw();
    });
    canvas.addEventListener("pointerup", () => { pointer = null; });
    canvas.addEventListener("pointercancel", () => { pointer = null; });
    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      zoom = Math.min(1.7, Math.max(0.55, zoom - event.deltaY * 0.001));
      draw();
    }, { passive: false });
  }
  new ResizeObserver(draw).observe(canvas);
  draw();
})();
</script>
