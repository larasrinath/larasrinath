{{ $contact := hugo.Data.home.contact }}
<nav class="contact-social-links" aria-label="{{ .Title }}">
  <ul>
    {{ range $index, $link := where $contact.links "external" true }}
      <li>
        <a href="{{ .href | safeURL }}" target="_blank" rel="noopener noreferrer">
          <span class="contact-link-index" aria-hidden="true">{{ printf "%02d" (add $index 1) }}</span>
          <span class="contact-link-logo" aria-hidden="true"><i class="{{ .icon }} fa-fw"></i></span>
          <span class="contact-link-label">{{ .label }}</span>
          <span class="contact-link-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" focusable="false"><path d="M5 19 19 5M5 5h14v14" /></svg>
          </span>
        </a>
      </li>
    {{ end }}
  </ul>
</nav>
