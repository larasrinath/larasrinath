overview_label: Summary
summary:
  - Lara Srinath is a **[Master Anaplanner](https://community.anaplan.com/categories/certified-master-anaplanner-program-information)** and **Solution Architect** with more than ten years of experience delivering, optimizing and supporting enterprise planning platforms across supply chain and finance.
  - His work spans solution architecture, platform operations, governance, data integration and continuous improvement. He has led cross-functional teams and business-critical platforms, partnering with executive stakeholders to build scalable, secure and high-performing planning systems.

