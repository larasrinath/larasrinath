about:
  label: 01 — About
  heading_prefix: Turning messy operations into systems people can
  heading_emphasis: trust
  heading_suffix: .
  portrait: /img/portfolio/lara-portrait.png
  portrait_alt: Portrait of Lara Srinath
  portrait_caption: planning since 2016
  paragraphs:
    - I'm an Anaplan Delivery Manager at GenXAI, specializing in supply chain and financial planning across FMCG, chemicals, energy and retail. For more than nine years, I've helped teams turn complex data and real-world processes into timely, actionable decisions.
    - My work spans model design, implementation, optimization and data integration. I lead cross-functional delivery teams, establish governance and modelling standards, and mentor consultants as they grow their craft.
    - Away from planning applications, you'll find me building LEGO, stargazing, cycling, playing chess or keeping the red flag flying high for Manchester United.
