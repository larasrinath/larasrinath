# The URL of your site.
# End your URL with a `/` trailing slash, e.g. `https://example.com/`.
baseURL = "https://www.larasrinath.com/"
locale = "en-US"
title = "Lara Srinath"
author = "Lara Srinath"
copyright = "" # set to override the auto generated copyright using org info and now year
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
enableEmoji = true

[pagination]
  pagerSize = 5

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true  # Enable user to embed HTML snippets in Markdown content.
    hardwraps = false 
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    # one of: https://xyproto.github.io/splash/docs/ 
    style = "manie"
    
[params]
  orgName = "Lara Srinath"
  orgLocal = ""
  description = "Personal website of Lara Srinath - Anaplan Solution Architect & Master Anaplanner specializing in Supply Chain Optimization."
  favicon = "/img/icon.png"
  mainSections = ["blog", "project", "talk"]
  # Default image for social sharing and search engines. 
  # Place image file in `static` folder and specify image name here.
  sharing_image = "/img/avatar.png"
  # Twitter username (without @). Used when a visitor shares your site on Twitter.
  twitter = "larasrinath"
  

[services.googleAnalytics]
  id = "G-N42DXSJWCH"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

# See https://gohugo.io/about/hugo-and-gdpr/.
[privacy]
  [privacy.disqus]
    disable = false
  [privacy.googleAnalytics]
    disable = false
    anonymizeIP = true
    respectDoNotTrack = true
  [privacy.instagram]
    disable = false
    simple = true
  [privacy.x]
    disable = false
    enableDNT = true
    simple = false
  [privacy.vimeo]
    disable = false
    enableDNT = true
    simple = true
  [privacy.youtube]
    disable = false
    privacyEnhanced = true
