# Core site identity
baseURL = "https://www.larasrinath.com/"
locale = "en-US"
title = "Lara Srinath"
enableRobotsTXT = true

# Required by named emoji shortcodes in long-form content.
enableEmoji = true

# Global fallback. Blog, Project and Talk list pages can override this in YAML.
[pagination]
  pagerSize = 6

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Content rendering
[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    # Long-form content includes trusted shortcodes and HTML controls.
    unsafe = true
    hardwraps = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
    ordered = false
  [markup.highlight]
    style = "manie"

# Shared metadata used by the head and social-card templates.
[params]
  orgName = "Lara Srinath"
  description = "Personal website of Lara Srinath, Manager - Anaplan Delivery at GenXAI, Master Anaplanner and Solution Architect working across enterprise supply chain and finance planning."
  favicon = "/img/icon.png"
  mainSections = ["blog", "project", "talk"]
  sharing_image = "/img/avatar.png"
  twitter = "larasrinath"

[services.googleAnalytics]
  id = "G-N42DXSJWCH"

# Only taxonomies represented by current content and templates.
[taxonomies]
  category = "categories"
  tag = "tags"

[privacy]
  [privacy.googleAnalytics]
    disable = false
    anonymizeIP = true
    respectDoNotTrack = true
